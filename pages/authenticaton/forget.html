<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forget password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/dist/CSS/style.css">

</head>
<body>
  
        
    <div class="forgcontainer">
        <div class="forgsidebar">
         <img src="/dist/image/ChatGPT Image Apr 9, 2026, 01_54_08 PM.png" alt="sidepicture">
        </div>
            <div class="forgetpass">
                <h2 class="forget-title">ResolvedIt</h2>
             <div class="forget-card">
                  <div class="logicon">
                   </div>
                   
                        <p class="forgt">Forget Password?</p>
                        <!-- <i class="fa-solid fa-lock"></i> -->
                  
               
                  <!-- Form that handles sending the reset link -->
                  <form id="forgetPasswordForm">
                     <div class="input-email">
                          <i class="fa-regular fa-envelope"></i>
                          <!-- Input field for the user's email, marked as required to prevent empty submissions -->
                          <input type="email" placeholder="Email Address" required>
                      </div>

                      <!-- Submit button to trigger the form submission -->
                      <button type="submit" class="sendlink-btn"><i class="fa-regular fa-paper-plane"></i> Send Link</button>
                 </form>
             </div>
           </div>
        
    </div>

    <!-- Modal overlay that will be displayed upon successful email submission -->
    <div class="modal-overlay" id="emailSentModal">
        <div class="modal-content">
            <!-- Icon to indicate success -->
            <i class="fa-regular fa-circle-check modal-icon"></i>
            <!-- Message displayed to the user -->
            <p>An email has been sent to your email address.</p>
            <!-- Button to acknowledge the message and redirect -->
            <button class="modal-ok-btn" id="modalOkBtn">OK</button>
        </div>
    </div>

    <!-- External JavaScript file handling the modals -->
    <script src="/dist/js/modals.js"></script>
   
</body>
</html>
