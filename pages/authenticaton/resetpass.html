<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reset password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/dist/CSS/style.css">
</head>
<body>


    <div class="resetcontainer">
         <div class="resetsidebar">
           <img src="/dist/image/ChatGPT Image Apr 9, 2026, 01_54_08 PM.png" alt="sidepicture">
        </div>
        <div class="resetside">
            <h2 class="reset-title">ResolvedIt</h2>
            <div class="resetcard">
                <h2>Reset Your Password</h2>
                <form id="resetForm">
                    <div class="input-password">
                        <input type="password" id="newPassword" placeholder="password" required>
                        <input type="password" id="confirmPassword" placeholder="confirm password" required>
                    </div>
                    <button type="submit" class="reset-btn">Submit</button>
                </form>
              

            </div>
        </div>

    </div>
    
    <!-- Modal -->
    <div id="resetSuccessModal" class="modal-overlay">
        <div class="modal-content">
            <i class="fa-solid fa-circle-check modal-icon"></i>
            <h3>Password Successfully Changed</h3>
            <p>Your password has been updated successfully.</p>
            <button id="resetOkBtn" class="modal-ok-btn">OK</button>
        </div>
    </div>

    <script src="/dist/js/modals.js"></script>
</body>
</html>
